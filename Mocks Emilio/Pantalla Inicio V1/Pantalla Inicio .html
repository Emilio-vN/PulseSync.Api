<script>
let role = 'coach';

function selectRole(r) {
  role = r;
  const coach = document.getElementById('btn-coach');
  const atleta = document.getElementById('btn-atleta');
  const entrar = document.getElementById('btn-entrar');

  if (r === 'coach') {
    coach.style.background = '#E6F1FB';
    coach.style.borderColor = '#185FA5';
    coach.querySelector('div:last-child').style.color = '#185FA5';
    atleta.style.background = '#f5f5f5';
    atleta.style.borderColor = 'transparent';
    atleta.querySelector('div:last-child').style.color = '#aaa';
    entrar.style.background = '#185FA5';
    entrar.style.boxShadow = '0 6px 20px rgba(24,95,165,0.3)';
    entrar.textContent = 'Entrar como Coach';
  } else {
    atleta.style.background = '#E1F5EE';
    atleta.style.borderColor = '#1D9E75';
    atleta.querySelector('div:last-child').style.color = '#1D9E75';
    coach.style.background = '#f5f5f5';
    coach.style.borderColor = 'transparent';
    coach.querySelector('div:last-child').style.color = '#aaa';
    entrar.style.background = '#1D9E75';
    entrar.style.boxShadow = '0 6px 20px rgba(29,158,117,0.3)';
    entrar.textContent = 'Entrar como Atleta';
  }
}
</script>

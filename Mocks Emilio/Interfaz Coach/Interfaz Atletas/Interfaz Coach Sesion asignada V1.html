<script>
const startDay = 3;
const daysInMonth = 31;
const today = 10;
const existingEvents = [5, 8, 13, 15, 17, 22, 29];
const selected = new Set();

const grid = document.getElementById('cal-assign');
const badge = document.getElementById('count-badge');
const summary = document.getElementById('selected-summary');
const selectedList = document.getElementById('selected-list');
const btnGuardar = document.getElementById('btn-guardar');

const diasSemana = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

for (let i = 0; i < startDay; i++) {
  grid.appendChild(document.createElement('div'));
}

for (let d = 1; d <= daysInMonth; d++) {
  const cell = document.createElement('div');
  const isToday = d === today;
  const hasEvent = existingEvents.includes(d);
  const isSun = (d + startDay - 1) % 7 === 0;
  const isSat = (d + startDay - 1) % 7 === 6;

  cell.style.cssText = 'text-align:center;padding:2px 0;cursor:pointer;user-select:none;';
  cell.dataset.day = d;

  function renderCell(isSelected) {
    let bg = 'transparent';
    let border = 'none';
    let color = isSun || isSat ? '#D85A30' : '#1a1a1a';
    let dotColor = '';

    if (isSelected) {
      bg = '#1D9E75';
      color = '#fff';
    } else if (isToday) {
      border = '2px solid #aaa';
    }

    if (hasEvent && !isSelected) dotColor = '#185FA5';
    if (isSelected) dotColor = 'rgba(255,255,255,0.6)';

    cell.innerHTML = `
      <div style="
        width:34px;height:34px;border-radius:50%;margin:0 auto;
        display:flex;align-items:center;justify-content:center;
        background:${bg};border:${border};
        font-size:13px;font-weight:${isSelected || isToday ? '700' : '400'};
        color:${color};transition:all 0.15s;
      ">${d}</div>
      ${dotColor ? `<div style="width:5px;height:5px;border-radius:50%;background:${dotColor};margin:2px auto 0;"></div>` : '<div style="height:7px;"></div>'}
    `;
  }

  renderCell(false);

  cell.addEventListener('click', () => {
    if (selected.has(d)) {
      selected.delete(d);
      renderCell(false);
    } else {
      selected.add(d);
      renderCell(true);
    }

    // Update badge
    const count = selected.size;
    badge.textContent = count + (count === 1 ? ' día' : ' días');

    // Update button
    btnGuardar.style.opacity = count > 0 ? '1' : '0.5';

    // Update summary
    if (count > 0) {
      summary.style.display = 'block';
      const sorted = Array.from(selected).sort((a, b) => a - b);
      const dayIndex = d => (d + startDay - 1) % 7;
      selectedList.innerHTML = sorted.map(d =>
        `✓ ${diasSemana[dayIndex(d)]} ${d} de Mayo`
      ).join('<br>');
    } else {
      summary.style.display = 'none';
    }
  });

  grid.appendChild(cell);
}
</script>
